name: Collect and save cafeteria menus

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 KST
    - cron: '0 0 * * *' # 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meal-menu-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect menus
        run: python -u meal_menu.py
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('src/meal_menu.json').read_text(encoding='utf-8'))
          assert not data['errors'], data['errors']
          for provider in ('welliv', 'pulmuone'):
              assert data[provider], f'{provider}: empty menus'
              print(f'{provider}: {len(data[provider])} meals')
          PY
      - name: Commit JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/meal_menu.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update cafeteria menus and nutrition'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-menu-result
          path: src/meal_menu*.json
          if-no-files-found: warn
          retention-days: 14
